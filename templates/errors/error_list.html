{% extends "base.html" %}

{% block title %}
  Ошибки — Freim
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Список ошибок</h1>
  <a class="btn btn-primary btn-sm" href="{% url 'homepage:index' %}">На главную</a>
</div>

<p class="text-muted">Всего ошибок: {{ errors|length }}</p>

<div class="error-list">
  {% for error in errors %}
    {% include "errors/includes/error_card.html" %}
  {% empty %}
    <div class="alert alert-info">Ошибки не найдены.</div>
  {% endfor %}
</div>
{% endblock %}

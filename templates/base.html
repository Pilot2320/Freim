{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Freim{% endblock %}</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
  <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}" />
</head>
<body class="bg-body-tertiary">
  {% include "includes/navigation.html" %}

  <main class="container py-4">
    {% block content %}
    {% endblock %}
  </main>

  <footer class="container mt-4 mb-3 text-center text-muted border-top pt-3">
    <p class="mb-0">
      &copy; <span id="current-year"></span> Freim — Сервис учета ошибок
    </p>
  </footer>

  <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
